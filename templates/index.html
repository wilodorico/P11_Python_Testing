{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title mb-4">Welcome to the GUDLFT Login Portal!</h2>
                    <form action="showSummary" method="post" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Secretary Email</label>
                            <input type="email" name="email" id="email" class="form-control" required />
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Enter</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
