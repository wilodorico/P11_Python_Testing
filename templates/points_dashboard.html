{% extends "base.html" %}
{% block title %}Points Dashboard{% endblock %}
{% block content %}
    <h2 class="mb-4">Club Points Dashboard</h2>
    {% if clubs %}
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead class="table-primary">
                    <tr>
                        <th>Club Name</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody>
                    {% for club in clubs %}
                    <tr>
                        <td>{{ club.name }}</td>
                        <td>{{ club.points }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    {% else %}
        <p>No clubs registered.</p>
    {% endif %}
{% endblock %}
