{% extends "base.html" %}
{% block title %}Booking for {{ competition.name }} || GUDLFT{% endblock %}
{% block content %}
    <div class="card mx-auto mt-5" style="max-width: 400px;">
        <div class="card-body">
            <h2 class="card-title">{{ competition.name }}</h2>
            <p class="mb-3"><strong>Places available:</strong> {{ competition.available_places }}</p>
            <form action="/purchasePlaces" method="post" novalidate>
                <input type="hidden" name="club" value="{{ club.name }}">
                <input type="hidden" name="competition" value="{{ competition.name }}">
                <div class="mb-3">
                    <label for="places" class="form-label">How many places?</label>
                    <input type="number" name="places" id="places" class="form-control" min="1" required />
                </div>
                <button type="submit" class="btn btn-primary w-100">Book</button>
            </form>
        </div>
    </div>
{% endblock %}
